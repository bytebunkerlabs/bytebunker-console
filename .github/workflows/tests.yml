name: tests

# Unit and API tests on every push, on the Python versions the server must
# run on: 3.9 (macOS's system Python, as on the console host) and 3.12 (the app's).
# The desktop workflow covers macOS and Windows builds; this one adds Linux,
# where the headless server and dgx-serve's nodes live.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }       # 3.9 is not offered for the newest Ubuntu image
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every module
        run: python -m compileall -q -x "desktop/(build|dist|\.venv)" .
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v

  # What the unit tests cannot say: the agents layer under load for a few minutes (memory, threads and open files
  # flat, no secret in what it wrote or said), and the mail channel against real servers, Dovecot and Postfix over TLS.
  real:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soak (three agents on their schedules and channels)
        run: python tests/soak.py --minutes 3 --rate 2
      - name: Real mail servers on this runner
        run: BB_THROWAWAY_MACHINE=1 bash tests/real/mail_setup.sh
      - name: Mail in over IMAP, a run, a reply out over SMTP
        run: BB_THROWAWAY_MACHINE=1 python tests/real/mail_check.py .
